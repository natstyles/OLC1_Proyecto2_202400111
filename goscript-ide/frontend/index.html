<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GoScript IDE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; }
        .toolbar { padding: 15px; background: #2c3e50; color: white; display: flex; gap: 10px; align-items: center; }
        button, input { padding: 8px; cursor: pointer; }
        
        #tabs { 
            display: flex; 
            background: #ecf0f1; 
            border-bottom: 1px solid #ccc; 
            padding-top: 8px; 
            padding-left: 8px; 
            overflow-x: auto; 
            overflow-y: hidden; 
        }
        
        #tabs::-webkit-scrollbar { height: 6px; }
        #tabs::-webkit-scrollbar-track { background: #ecf0f1; }
        #tabs::-webkit-scrollbar-thumb { background: #bdc3c7; border-radius: 3px; }
        #tabs::-webkit-scrollbar-thumb:hover { background: #95a5a6; }

        .tab { padding: 8px 15px; margin-right: 4px; cursor: pointer; border: 1px solid #ccc; border-bottom: none; background: #ddd; border-radius: 5px 5px 0 0; white-space: nowrap; flex-shrink: 0; }
        .tab.active { background: #fff; font-weight: bold; position: relative; top: 1px; border-bottom: 1px solid #fff; }
        .close-btn { margin-left: 8px; font-size: 12px; color: #888; border-radius: 50%; padding: 2px 5px; }
        .close-btn:hover { background: #e74c3c; color: white; }
        
        .container { display: flex; flex: 1; overflow: hidden; }
        .editor-container, .console-container { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #ccc; overflow: hidden; }
        
        .editor-wrapper { flex: 1; position: relative; }
        .CodeMirror { position: absolute; top: 0; bottom: 0; left: 0; right: 0; height: 100%; font-size: 16px; }
        
        textarea.console { flex: 1; background: #1e1e1e; color: #00ff00; padding: 10px; resize: none; font-family: monospace; font-size: 16px; border: none; outline: none; }
        h3 { margin: 0; padding: 10px; background: #ecf0f1; border-bottom: 1px solid #ccc; font-size: 14px; }

        .report-tab { border: none; background: #34495e; color: white; padding: 10px 15px; cursor: pointer; transition: 0.3s; }
        .report-tab.active { background: #1e1e1e; border-bottom: 2px solid #3498db; }
        .report-content { display: none; flex-direction: column; flex: 1; overflow: hidden; background: #1e1e1e; color: white; }
        .report-content.active { display: flex; }
            
        .table-wrapper { padding: 10px; overflow-y: auto; flex: 1; }
        table { width: 100%; border-collapse: collapse; background: #fff; color: #333; font-size: 14px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #eee; position: sticky; top: 0; }
        .report-content h3 { color: #2c3e50; background: #ecf0f1; margin: 0; padding: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="btnEjecutar">Ejecutar</button>
        <button id="btnNuevaPestana">Nueva Pestaña</button>
        <input type="file" id="btnAbrir" accept=".gst">
        <button id="btnGuardar">Guardar</button>
        <button id="btnGuardarComo">Guardar Como</button>
    </div>
    
    <div class="container">
        <div class="editor-container">
            <div id="tabs"></div>
            <div class="editor-wrapper">
                <textarea id="editor"></textarea>
            </div>
        </div>
        <div class="console-container">
            <div id="report-tabs" style="display: flex; background: #2c3e50;">
                <button class="report-tab active" onclick="verReporte('consola')">Consola</button>
                <button class="report-tab" onclick="verReporte('errores')">Errores</button>
                <button class="report-tab" onclick="verReporte('simbolos')">Símbolos</button>
                <button class="report-tab" onclick="verReporte('ast')">AST</button>
            </div>
        
            <div id="cont-consola" class="report-content active">
                <textarea id="consola" class="console" readonly placeholder="Consola de salida..."></textarea>
            </div>
        
            <div id="cont-errores" class="report-content">
                <h3>Reporte de Errores</h3>
                <div class="table-wrapper">
                    <table id="tabla-errores">
                        <thead>
                            <tr><th>#</th><th>Descripción</th><th>Línea</th><th>Columna</th><th>Tipo</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        
            <div id="cont-simbolos" class="report-content">
                <h3>Tabla de Símbolos</h3>
                <div class="table-wrapper">
                    <table id="tabla-simbolos">
                        <thead>
                            <tr><th>ID</th><th>Tipo Símbolo</th><th>Tipo Dato</th><th>Ámbito</th><th>Línea</th><th>Columna</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        
            <div id="cont-ast" class="report-content">
                <h3>Árbol de Sintaxis Abstracta (AST)</h3>
                <div id="canvas-ast" style="flex: 1; background: white; overflow: auto; text-align: center;">
                    <p style="color: #666; margin-top: 20px;">Ejecuta el código para generar el árbol.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
